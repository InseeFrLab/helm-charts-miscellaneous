apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubejs.fullname" . }}
  labels:
    {{- include "cubejs.labels" . | nindent 4 }}
data:
  # file-like keys
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5    
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true    